# ---------------------------------------------------------------------------
# GitHub Actions: GitHub reads this file and runs it on its own servers
# every time code is pushed. This is the CI/CD pipeline.
#
#   push -> [test] -> [build image] -> [publish image to GitHub's registry]
#
# If "test" fails, the later jobs never run. Broken code never gets shipped.
# Watch it run in the "Actions" tab of the GitHub repo.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:                   # also test proposed changes before they're merged

jobs:
  test:
    runs-on: ubuntu-latest        # a fresh Linux machine GitHub lends you for free
    steps:
      - uses: actions/checkout@v4             # download the repo's code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  build-and-push:
    needs: test                   # only runs if `test` passed
    if: github.event_name == 'push'   # build/publish on real pushes, not on pull requests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write             # allows publishing to GitHub Container Registry (ghcr.io)
    steps:
      - uses: actions/checkout@v4

      # Log in to ghcr.io using a token GitHub provides automatically. No password needed.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names must be lowercase.
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Build the Dockerfile and push it with two tags:
      #   :latest            -> always the newest
      #   :<commit-sha>      -> exactly this version, forever (useful for rollbacks)
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  # Step 5 (deploy on push) goes here later. See README "Step 5".
